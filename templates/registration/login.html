{% extends 'base.html' %}
{% block title %}Sign in — JobConnectHub{% endblock %}
{% block content %}
<div class="auth-card card">
  <div class="card-body p-4">
    <div class="text-center mb-4">
      <div class="logo-mark mb-3" style="width:60px;height:60px;font-size:1.5rem;"><i class="bi bi-briefcase-fill"></i></div>
      <h3 class="fw-bold">Welcome back</h3>
      <p class="text-muted">Sign in to JobConnectHub</p>
    </div>
    <form method="post">{% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Sign in</button>
    </form>
    <p class="text-center mt-3 mb-0">No account? <a href="{% url 'register' %}">Register</a></p>
  </div>
</div>
{% endblock %}
